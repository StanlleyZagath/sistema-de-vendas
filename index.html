<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema de Vendas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0071e3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vendas">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css?v=30">
</head>
<body>
<aside class="side">
  <div class="brand"><span>Vendas</span><button class="menu-btn" onclick="document.querySelector('.side-foot').classList.toggle('open')" aria-label="Conta e opções">Conta</button></div>
  <nav id="nav">
    <div class="nav-h">Vender</div>
    <a href="#pdv" data-v="pdv">PDV (caixa)</a>
    <a href="#vendas" data-v="vendas">Vendas e pedidos</a>
    <a href="#receber" data-v="receber">A receber</a>
    <div class="nav-h">Relacionamento</div>
    <a href="#clientes" data-v="clientes">Clientes</a>
    <a href="#funil" data-v="funil">Funil (CRM)</a>
    <a href="#posts" data-v="posts">Gerador de posts</a>
    <div class="nav-h" data-admin>Gestão</div>
    <a href="#dashboard" data-v="dashboard">Painel</a>
    <a href="#produtos" data-v="produtos">Produtos e estoque</a>
    <a href="#relatorios" data-v="relatorios">Relatórios</a>
    <a href="#catalogo" data-v="catalogo">Catálogo online</a>
    <a href="#usuarios" data-v="usuarios">Usuários</a>
  </nav>
  <div class="side-foot">
    <div class="who" id="who"></div>
    <div class="foot-links">
      <button onclick="A.myPassword()">Minha senha</button>
      <button onclick="A.logout()">Sair</button>
      <button id="instbtn" onclick="A.install()" hidden>Instalar app</button>
      <button onclick="A.backup()">Backup</button>
      <button onclick="A.restore()">Restaurar</button>
      <button onclick="A.reset()">Zerar dados</button>
    </div>
  </div>
</aside>
<main>
  <header class="top"><h1 id="title"></h1><div id="actions"></div></header>
  <section id="main"></section>
</main>
<div id="login" hidden>
  <form id="lform" class="card">
    <h2>Sistema de Vendas</h2>
    <label>Usuário<input name="login" autocomplete="username" required autofocus></label>
    <label>Senha<input name="pass" type="password" autocomplete="current-password" required></label>
    <div id="lerr" class="lerr" role="alert"></div>
    <div id="lhint" class="lhint"></div>
    <button class="btn" style="width:100%">Entrar</button>
    <button type="button" class="linkbtn" id="lforgot" hidden>Esqueci a senha</button>
  </form>
  <form id="sform" class="card" hidden>
    <h2>Criar administrador</h2>
    <p class="sub">Primeiro acesso à nuvem: crie o usuário que vai gerenciar a loja.</p>
    <label>Seu nome<input name="name" required></label>
    <label>E-mail<input name="email" type="email" autocomplete="username" required></label>
    <label>Senha (mín. 6 caracteres)<input name="pass" type="password" minlength="6" autocomplete="new-password" required></label>
    <div id="serr" class="lerr" role="alert"></div>
    <button class="btn" style="width:100%">Criar e entrar</button>
  </form>
</div>
<div id="receipt"></div>
<dialog id="modal"><form method="dialog" id="mform"></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<nav id="tabbar" aria-label="Menu principal" hidden></nav>
<div id="more" hidden><div class="more-bg"></div><div class="more-sheet" role="dialog" aria-label="Mais opções"></div></div>
<input type="file" id="file" accept="application/json" hidden>
<script src="firebase-config.js?v=2"></script>
<script src="cloud.js?v=2"></script>
<script src="catalog.js?v=24"></script>
<script src="posts.js?v=3"></script>
<script src="app.js?v=30"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(function () {});
window.__inst = null;
var standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__inst = e; document.getElementById('instbtn').hidden = false; });
window.addEventListener('appinstalled', function () { document.getElementById('instbtn').hidden = true; });
if (ios && !standalone && location.protocol === 'https:') document.getElementById('instbtn').hidden = false;
</script>
</body>
</html>
